<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="description" content="Discover destination highlights and places to visit with Jovick Travel & Tours. Contact us to confirm available tours, prices and travel arrangements.">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Destination Details | Jovick Travel &amp; Tours</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/footer.css">
  <link rel="stylesheet" href="styles/destination-details.css">
  <link rel="stylesheet" href="styles/mediaquery.css">

  <link rel="icon" href="images/Jovick-logo.jpg" type="image/jpeg">
</head>


<body>


  <!-- ================================
       HEADER
       ================================ -->

      <div id="site-header"></div>

  <a class="page-back-link" href="destinations.html" aria-label="Back to destinations" title="Back to destinations"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></a>


  <!-- ================================
       DESTINATION HERO
       ================================ -->

  <section
    class="destination-details-hero"
    id="destinationHero"
  >

    <div class="destination-hero-overlay">

      <p id="destinationCountry"></p>

      <h1 id="destinationName">
        Destination
      </h1>

      <p id="destinationTagline"></p>

    </div>

  </section>


  <!-- ================================
       DESTINATION INFORMATION
       ================================ -->

  <main>

    <section class="destination-details-section">

      <div class="destination-details-content">


        <!-- ABOUT -->

        <article class="destination-about">

          <span class="destination-section-label">
            Discover
          </span>

          <h2 id="aboutTitle">
            About this destination
          </h2>

          <p id="destinationDescription"></p>

        </article>


        <!-- PLACES TO VISIT -->

        <article class="places-to-visit">

          <span class="destination-section-label">
            Explore
          </span>

          <h2>
            Nice Places to Visit
          </h2>

          <div
            class="places-grid"
            id="placesGrid"
          >
          </div>

        </article>


        <!-- TRAVEL EXPERIENCE -->

        <article class="destination-experience">

          <span class="destination-section-label">
            Experience
          </span>

          <h2>
            Why Visit <span id="experienceName"></span>?
          </h2>

          <p id="experienceText"></p>

        </article>


        <!-- CTA -->

        <article class="destination-booking-card">

          <div>

            <span class="destination-section-label">
              Ready to travel?
            </span>

            <h2>
              Explore this destination with us
            </h2>

            <p>
              View our available tour and continue
              to the booking page.
            </p>

          </div>


          <div class="destination-actions">

            <a
              href="destinations.html"
              class="back-destinations"
            >
              <i class="fa-solid fa-arrow-left"></i>
              Destinations
            </a>

            <a
              href="#"
              id="viewTourButton"
              class="view-destination-tour"
            >
              View Tour &amp; Book Now
              <i class="fa-solid fa-arrow-right"></i>
            </a>

          </div>

        </article>


      </div>

    </section>

  </main>


  <!-- ================================
       FOOTER
       ================================ -->

      <div id="site-footer"></div>


  <!-- ================================
       JAVASCRIPT
       ================================ -->

  <script src="scripts/main.js"></script>

  <script src="scripts/destination-details.js"></script>

</body>

</html>
